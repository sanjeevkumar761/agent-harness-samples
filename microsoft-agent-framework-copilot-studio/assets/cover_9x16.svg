<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1F"/><stop offset="0.55" stop-color="#111A3E"/><stop offset="1" stop-color="#1E1247"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F8CFF"/><stop offset="1" stop-color="#8A5CF6"/>
    </linearGradient>
    <radialGradient id="gp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8A5CF6" stop-opacity="0.5"/><stop offset="1" stop-color="#8A5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4F8CFF" stop-opacity="0.55"/><stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="900" cy="220" r="520" fill="url(#gp)"/>
  <circle cx="180" cy="1650" r="520" fill="url(#gb)"/>

  <!-- Kicker -->
  <rect x="90" y="150" width="72" height="8" rx="4" fill="url(#accent)"/>
  <text x="90" y="214" fill="#9FB6E6" font-size="30" font-weight="600" letter-spacing="4">MICROSOFT AGENT FRAMEWORK</text>

  <!-- Headline -->
  <text x="86" y="340" fill="#FFF" font-size="108" font-weight="800" letter-spacing="-2">Call Copilot</text>
  <text x="86" y="452" fill="#FFF" font-size="108" font-weight="800" letter-spacing="-2">Studio agents</text>
  <text x="86" y="564" fill="#6FA0FF" font-size="108" font-weight="800" letter-spacing="-2">from code.</text>

  <!-- Subhead -->
  <text x="90" y="646" fill="#B9C6E6" font-size="36" font-weight="500">Live demo &#183; Entra ID auth &#183; 3 lines of code</text>

  <!-- Badges -->
  <g filter="url(#soft)">
    <rect x="90" y="700" width="180" height="64" rx="32" fill="#0E1A34" stroke="#2C3E6B" stroke-width="1.5"/>
    <circle cx="128" cy="732" r="9" fill="#34D399"/>
    <text x="150" y="742" fill="#DCE6FA" font-size="28" font-weight="600">Live</text>
    <rect x="288" y="700" width="240" height="64" rx="32" fill="#0E1A34" stroke="#2C3E6B" stroke-width="1.5"/>
    <text x="316" y="742" fill="#DCE6FA" font-size="28" font-weight="600">&#128274; Entra ID</text>
    <rect x="546" y="700" width="360" height="64" rx="32" fill="#0E1A34" stroke="#2C3E6B" stroke-width="1.5"/>
    <text x="576" y="742" fill="#DCE6FA" font-size="28" font-weight="600">&#9889; Direct-to-Engine</text>
  </g>

  <!-- Chat card -->
  <g filter="url(#soft)">
    <rect x="90" y="830" width="900" height="470" rx="30" fill="#0E1630" stroke="#2C3E6B" stroke-width="1.5"/>
    <text x="130" y="900" fill="#9FB6E6" font-size="26" font-weight="600" letter-spacing="1">COPILOT STUDIO &#215; AGENT FRAMEWORK</text>
    <rect x="470" y="936" width="480" height="86" rx="26" fill="url(#accent)"/>
    <text x="710" y="990" fill="#FFF" font-size="34" font-weight="600" text-anchor="middle">What can this agent do?</text>
    <rect x="130" y="1060" width="560" height="176" rx="26" fill="#16224A"/>
    <text x="164" y="1112" fill="#8AB4FF" font-size="26" font-weight="700">Agent</text>
    <text x="164" y="1166" fill="#FFF" font-size="40" font-weight="700">Answers live <tspan fill="#34D399">&#10003;</tspan></text>
    <text x="164" y="1210" fill="#9FB6E6" font-size="24">via Direct-to-Engine API</text>
  </g>

  <!-- Code chip -->
  <g filter="url(#soft)">
    <rect x="90" y="1360" width="900" height="200" rx="22" fill="#0B1226" stroke="#263461" stroke-width="1.5"/>
    <circle cx="128" cy="1402" r="8" fill="#FF5F57"/><circle cx="154" cy="1402" r="8" fill="#FEBC2E"/><circle cx="180" cy="1402" r="8" fill="#28C840"/>
    <text x="128" y="1470" font-family="Consolas,monospace" font-size="30" fill="#8AB4FF">agent <tspan fill="#C9D4EE">=</tspan> CopilotStudioAgent()</text>
    <text x="128" y="1516" font-family="Consolas,monospace" font-size="30" fill="#C9D4EE">reply = <tspan fill="#8A5CF6">await</tspan> agent.run(<tspan fill="#34D399">"..."</tspan>)</text>
  </g>

  <!-- Play pill -->
  <g filter="url(#soft)">
    <rect x="90" y="1640" width="560" height="92" rx="46" fill="#FFF"/>
    <circle cx="146" cy="1686" r="26" fill="#5B47F0"/>
    <path d="M137 1673 L137 1699 L160 1686 Z" fill="#FFF"/>
    <text x="190" y="1697" fill="#111A3E" font-size="34" font-weight="700">Watch the live demo</text>
  </g>

  <!-- Footer -->
  <text x="90" y="1860" fill="#7C8CB5" font-size="26" font-weight="500">github.com/sanjeevkumar761/agent-harness-samples</text>
</svg>
