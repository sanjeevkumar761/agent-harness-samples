<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1F"/>
      <stop offset="0.55" stop-color="#111A3E"/>
      <stop offset="1" stop-color="#1E1247"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#8A5CF6"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F8CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A5CF6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8A5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1050" cy="140" r="360" fill="url(#glowPurple)"/>
  <circle cx="180" cy="620" r="340" fill="url(#glowBlue)"/>

  <!-- Faint grid -->
  <g stroke="#8FA6D9" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="96" width="64" height="6" rx="3" fill="url(#accent)"/>

  <!-- Kicker -->
  <text x="80" y="150" fill="#9FB6E6" font-size="24" font-weight="600" letter-spacing="3">MICROSOFT AGENT FRAMEWORK</text>

  <!-- Headline -->
  <text x="78" y="250" fill="#FFFFFF" font-size="82" font-weight="800" letter-spacing="-1">Call Copilot Studio</text>
  <text x="78" y="336" fill="#FFFFFF" font-size="82" font-weight="800" letter-spacing="-1">agents <tspan fill="#6FA0FF">from code</tspan>.</text>

  <!-- Subhead -->
  <text x="80" y="398" fill="#B9C6E6" font-size="30" font-weight="500">Live demo &#183; Entra ID auth &#183; 3 lines of code</text>

  <!-- Badges -->
  <g filter="url(#soft)">
    <rect x="80" y="440" width="150" height="52" rx="26" fill="#0E1A34" stroke="#2C3E6B" stroke-width="1.5"/>
    <circle cx="112" cy="466" r="7" fill="#34D399"/>
    <text x="130" y="474" fill="#DCE6FA" font-size="22" font-weight="600">Live</text>

    <rect x="244" y="440" width="196" height="52" rx="26" fill="#0E1A34" stroke="#2C3E6B" stroke-width="1.5"/>
    <text x="266" y="474" fill="#DCE6FA" font-size="22" font-weight="600">&#128274; Entra ID</text>

    <rect x="454" y="440" width="288" height="52" rx="26" fill="#0E1A34" stroke="#2C3E6B" stroke-width="1.5"/>
    <text x="476" y="474" fill="#DCE6FA" font-size="22" font-weight="600">&#9889; Direct-to-Engine</text>
  </g>

  <!-- Code chip -->
  <g filter="url(#soft)">
    <rect x="80" y="540" width="620" height="120" rx="16" fill="#0B1226" stroke="#26346180" stroke-width="1.5"/>
    <circle cx="108" cy="568" r="6" fill="#FF5F57"/>
    <circle cx="128" cy="568" r="6" fill="#FEBC2E"/>
    <circle cx="148" cy="568" r="6" fill="#28C840"/>
    <text x="104" y="612" font-family="'Cascadia Code','Consolas',monospace" font-size="22" fill="#8AB4FF">agent <tspan fill="#C9D4EE">=</tspan> CopilotStudioAgent()</text>
    <text x="104" y="644" font-family="'Cascadia Code','Consolas',monospace" font-size="22" fill="#C9D4EE">reply <tspan fill="#C9D4EE">=</tspan> <tspan fill="#8A5CF6">await</tspan> agent.run(<tspan fill="#34D399">"Capital of France?"</tspan>)</text>
  </g>

  <!-- Chat card (right) -->
  <g filter="url(#soft)">
    <rect x="800" y="150" width="400" height="300" rx="24" fill="#0E1630" stroke="#2C3E6B" stroke-width="1.5"/>
    <text x="832" y="200" fill="#9FB6E6" font-size="20" font-weight="600" letter-spacing="1">COPILOT STUDIO &#215; AGENT FRAMEWORK</text>

    <!-- user bubble -->
    <rect x="944" y="224" width="224" height="56" rx="18" fill="url(#accent)"/>
    <text x="1056" y="259" fill="#FFFFFF" font-size="22" font-weight="600" text-anchor="middle">Capital of France?</text>

    <!-- agent bubble -->
    <rect x="832" y="300" width="230" height="110" rx="18" fill="#16224A"/>
    <text x="856" y="340" fill="#8AB4FF" font-size="18" font-weight="700">Agent</text>
    <text x="856" y="374" fill="#FFFFFF" font-size="26" font-weight="700">Paris <tspan fill="#34D399">&#10003;</tspan></text>
    <text x="856" y="400" fill="#9FB6E6" font-size="15">via Direct-to-Engine</text>
  </g>

  <!-- Play pill -->
  <g filter="url(#soft)">
    <rect x="800" y="486" width="400" height="70" rx="35" fill="#FFFFFF"/>
    <circle cx="842" cy="521" r="20" fill="#5B47F0"/>
    <path d="M835 511 L835 531 L853 521 Z" fill="#FFFFFF"/>
    <text x="878" y="530" fill="#111A3E" font-size="26" font-weight="700">Watch the live demo</text>
  </g>

  <!-- Footer brand -->
  <text x="80" y="694" fill="#7C8CB5" font-size="20" font-weight="500">github.com/sanjeevkumar761/agent-harness-samples</text>
</svg>
